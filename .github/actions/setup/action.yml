name: Factory setup
description: >
  Prepare a GitHub Ubuntu runner exactly like a developer machine: run bootstrap.sh (the same
  script used on Arch and WSL), then put the pinned tools on PATH. Tool installs are cached, keyed
  on the files that pin their versions.

runs:
  using: composite
  steps:
    - name: Restore cached tools (Rust toolchain, mise tools, Archi)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.local/share/mise
          ~/.local/opt
        key: tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'mise.toml', 'tools/archi.env') }}

    - name: Bootstrap (bootstrap.sh, same as on Arch / WSL)
      shell: bash
      env:
        # Authenticated GitHub downloads for mise / cargo-binstall (avoids API rate limits).
        GITHUB_TOKEN: ${{ github.token }}
        MISE_YES: "1"
      run: ./bootstrap.sh

    - name: Put pinned tools on PATH
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

    - name: Cache Rust build output
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
