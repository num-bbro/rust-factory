# CI: the same gates as `just check`, on every pull request and on main.
# The `main` ruleset requires these jobs to pass before a PR can be merged.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Format
        run: just fmt-check
      - name: Lint (clippy, warnings are errors)
        run: just lint
      - name: Tests (unit, property, HTTP, architecture)
        run: just test --profile ci
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Dependency policy (cargo-deny)
        run: just deny
      - name: Coverage
        run: just coverage
      - name: Architecture model and doc references
        run: just model-check

  model:
    name: architecture model
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build ArchiMate model and HTML report (headless, Xvfb)
        run: just model
      - name: Upload model and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-model
          path: |
            build/architecture/model.archimate
            build/architecture/model.xml
            build/architecture/report/

  mutants:
    name: mutants (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Mutation-test only what this PR changes
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          cargo mutants --workspace --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff"
      - name: Upload surviving mutants
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: mutants.out/
