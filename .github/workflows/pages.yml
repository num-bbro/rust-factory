# Architecture site: the rendered ADR and TOGAF documents and Archi's clickable HTML report
# (ADR 0009, step 7). Pull requests build the site and upload it as the artifact `site` for
# inspection; only a push to main (or a manual run on main) deploys it to GitHub Pages.
# Not a required check. One-time human step: Settings > Pages > Source = "GitHub Actions".
name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A newer push cancels a pull request's build, never a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    # pages: read lets the Jekyll action learn the site's base path from the Pages API.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build the ArchiMate model and HTML report (headless, Xvfb)
        run: just model
      - name: Render the documents (Jekyll, GitHub-flavoured Markdown)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      # The Jekyll action runs in a container as root, so _site belongs to root.
      - name: Add the clickable report
        run: sudo cp -r build/architecture/report _site/report
      # Never publish a site whose links are broken: the base path comes from the Pages API.
      - name: Check the site's base path
        if: github.ref == 'refs/heads/main'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if ! grep -q "href=\"/$REPO_NAME/assets/css/style.css" _site/index.html; then
            echo "::error::_site/index.html does not link its stylesheet under /$REPO_NAME/: the base path is wrong (is Pages enabled with Source = GitHub Actions?)"
            exit 1
          fi
      - name: Upload the site for inspection (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site/
      - name: Upload the site for Pages (main)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: deploy
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
