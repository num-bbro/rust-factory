name: Bug
description: Something does not behave as specified.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /bookings with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the story or requirement that specifies it, if any.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and logs. Remove secrets and personal data.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: v0.3.1 on pilot
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (outage, data loss, security)
        - Major (feature broken, no workaround)
        - Minor (workaround exists)
        - Cosmetic
    validations:
      required: true
