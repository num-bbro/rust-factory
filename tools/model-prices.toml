# Anthropic API list prices in USD per million tokens, used by `just cost` (scripts/cost-report.py).
# Source: Claude API reference (models and prompt-caching pages), checked 2026-11-15.
# Cache writes: 1.25x input for the 5-minute TTL, 2x input for the 1-hour TTL.
# On a Claude subscription you are not billed per token; the report then shows what the same work
# would cost at API list price, which is still the right yardstick for comparing models.
# Update deliberately when prices change (one PR), like any other pinned version.

[models.claude-fable-5-2]
input = 8.00
output = 40.00
cache_write_5m = 10.00
cache_write_1h = 16.00
cache_read = 0.20

# Previous Fable, still served. Listed so old sessions are priced correctly; the conductor is
# pinned to claude-fable-5-2 (the "fable" alias resolved to 5.1 in testing, at a higher price).
[models.claude-fable-5-1]
input = 10.00
output = 50.00
cache_write_5m = 12.50
cache_write_1h = 20.00
cache_read = 0.25

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_write_5m = 5.00
cache_write_1h = 8.00
cache_read = 0.20

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_write_5m = 2.50
cache_write_1h = 4.00
cache_read = 0.10

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write_5m = 0.125
cache_write_1h = 0.20
cache_read = 0.01            # 0.1x input; matches Claude Code's own cost figures (checked 2026-11-15)
# Prompts above 100K tokens are billed at a higher tier.
long_context_threshold = 100000
long_input = 0.50
long_output = 2.50
