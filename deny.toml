# cargo-deny: dependency policy, checked by `just check` and CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Known security vulnerabilities and unmaintained crates (RustSec advisory database).
[advisories]
version = 2
yanked = "deny"
ignore = [
    # Format: { id = "RUSTSEC-YYYY-NNNN", reason = "why this does not affect us; issue #N" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained, not a known vulnerability; reached only through the test-only dev-dependency cucumber (crates/acceptance-tests), not in the shipped service; issue #89" },
]

# Only licenses that are safe to ship in a commercial product without source-disclosure duties.
# Adding a license here is a decision: record it in an ADR.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"   # duplicate crate versions bloat builds; reviewed, not blocking
wildcards = "deny"           # every dependency has a real version requirement...
allow-wildcard-paths = true  # ...except our own crates, referenced by path (publish = false)
deny = [
    # Example of banning a crate outright:
    # { name = "openssl", reason = "use rustls; ADR 00NN" },
]

# Dependencies may come only from crates.io: no random git repositories.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
